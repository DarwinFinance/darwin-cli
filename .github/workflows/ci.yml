name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.3.0" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - run: bun run build
      - name: Packed tarball installs clean and runs offline
        shell: bash
        run: |
          npm pack
          mkdir -p "$RUNNER_TEMP/clean" && cd "$RUNNER_TEMP/clean"
          npm init -y >/dev/null
          npm i --ignore-scripts "$GITHUB_WORKSPACE"/darwinfinance-cli-*.tgz
          ./node_modules/.bin/darwin --version
          ./node_modules/.bin/darwin help --json > help.json
          node -e "const h=require('./help.json'); if(!h.commands.find(c=>c.command==='quote')) process.exit(1)"
          # The tarball holds only the bundle, README, LICENSE, package.json and the shrinkwrap.
          tar -tzf "$GITHUB_WORKSPACE"/darwinfinance-cli-*.tgz | sort > files.txt
          cat files.txt
          ! grep -v -E '^package/(dist/darwin.js|README.md|LICENSE|package.json|npm-shrinkwrap.json)$' files.txt
